<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GGITS Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#16233D;
    --navy-deep:#0F1830;
    --parchment:#FBF7EE;
    --paper:#FFFDF8;
    --ink:#23282F;
    --ink-soft:#5B6270;
    --hairline:#DED2AE;
    --gold:#C9A227;
    --gold-deep:#A6821A;
    --tag-academic:#4F6F52;
    --tag-academic-bg:#E9F0E7;
    --tag-fee:#9C4A3A;
    --tag-fee-bg:#F5E8E3;
    --tag-general:#556074;
    --tag-general-bg:#E9EBEF;
  }

  * { box-sizing: border-box; }

  body{
    margin:0;
    background:var(--parchment);
    color:var(--ink);
    font-family:'Inter', -apple-system, sans-serif;
    min-height:100vh;
  }

  /* ---------- Letterhead ---------- */
  header.letterhead{
    background:var(--navy);
    color:var(--parchment);
    padding:22px 28px 20px;
    border-bottom:3px solid var(--gold);
  }
  .letterhead-inner{
    max-width:680px;
    margin:0 auto;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
  }
  .crest-title{
    font-family:'Source Serif 4', Georgia, serif;
    font-weight:700;
    font-size:1.5rem;
    letter-spacing:0.01em;
  }
  .crest-sub{
    font-size:0.8rem;
    color:#C7CEDE;
    margin-top:2px;
  }
  .programme-chip{
    font-size:0.78rem;
    border:1px solid rgba(201,162,39,0.55);
    color:var(--gold);
    padding:4px 10px;
    border-radius:2px;
    white-space:nowrap;
    align-self:center;
  }

  main{
    max-width:680px;
    margin:0 auto;
    padding:0 20px 24px;
  }

  /* ---------- Programme selector screen ---------- */
  #selector{
    padding-top:48px;
  }
  #selector h2{
    font-family:'Source Serif 4', Georgia, serif;
    font-weight:600;
    font-size:1.3rem;
    margin-bottom:6px;
  }
  #selector p.hint{
    color:var(--ink-soft);
    font-size:0.92rem;
    margin-top:0;
    margin-bottom:22px;
  }
  .chip-grid{
    display:grid;
    grid-template-columns:repeat(2, 1fr);
    gap:10px;
  }
  .prog-chip{
    text-align:left;
    background:var(--paper);
    border:1px solid var(--hairline);
    padding:14px 16px;
    font-family:'Inter';
    font-size:0.95rem;
    font-weight:500;
    color:var(--ink);
    cursor:pointer;
    transition:border-color 0.15s ease, background 0.15s ease;
  }
  .prog-chip:hover{
    border-color:var(--gold-deep);
    background:#FFFCF3;
  }
  .prog-chip .code{
    display:block;
    font-size:0.72rem;
    color:var(--ink-soft);
    margin-bottom:3px;
  }

  /* ---------- Chat screen ---------- */
  #chat-screen{ display:none; }
  #chat-screen.active{
    display:flex;
    flex-direction:column;
    height:calc(100vh - 96px);
    animation: rise 0.35s ease;
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  #messages{
    flex:1;
    overflow-y:auto;
    padding:20px 2px 12px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .row{ display:flex; }
  .row.human{ justify-content:flex-end; }
  .row.ai{ justify-content:flex-start; }

  .bubble{
    max-width:78%;
    padding:11px 14px;
    font-size:0.94rem;
    line-height:1.48;
  }
  .row.human .bubble{
    background:var(--navy);
    color:var(--parchment);
    border-radius:10px 10px 2px 10px;
  }
  .row.ai .bubble-wrap{ max-width:78%; }
  .row.ai .bubble{
    background:var(--paper);
    border:1px solid var(--hairline);
    border-radius:10px 10px 10px 2px;
    max-width:100%;
  }

  .tag{
    display:inline-block;
    font-size:0.7rem;
    font-weight:600;
    padding:2px 8px;
    border-radius:2px;
    margin-bottom:6px;
  }
  .tag.academic{ color:var(--tag-academic); background:var(--tag-academic-bg); }
  .tag.fee{ color:var(--tag-fee); background:var(--tag-fee-bg); }
  .tag.general{ color:var(--tag-general); background:var(--tag-general-bg); }

  .typing .bubble{
    display:flex;
    gap:4px;
    align-items:center;
    padding:14px 16px;
  }
  .typing .dot{
    width:6px; height:6px;
    border-radius:50%;
    background:var(--ink-soft);
    animation:blink 1.1s infinite ease-in-out;
  }
  .typing .dot:nth-child(2){ animation-delay:0.18s; }
  .typing .dot:nth-child(3){ animation-delay:0.36s; }
  @keyframes blink{
    0%, 80%, 100%{ opacity:0.25; }
    40%{ opacity:1; }
  }

  /* ---------- Input bar ---------- */
  #input-bar{
    display:flex;
    gap:10px;
    border-top:1px solid var(--hairline);
    padding-top:12px;
  }
  #msg-input{
    flex:1;
    border:1px solid var(--hairline);
    background:var(--paper);
    padding:12px 14px;
    font-size:0.94rem;
    font-family:'Inter';
    color:var(--ink);
  }
  #msg-input:focus{
    outline:none;
    border-color:var(--gold-deep);
  }
  #send-btn{
    background:var(--navy);
    color:var(--parchment);
    border:none;
    padding:0 20px;
    font-family:'Inter';
    font-weight:600;
    font-size:0.9rem;
    cursor:pointer;
  }
  #send-btn:hover{ background:var(--navy-deep); }
  #send-btn:disabled{ opacity:0.5; cursor:default; }

  .error-note{
    color:var(--tag-fee);
    font-size:0.85rem;
    padding:8px 0;
  }
</style>
</head>
<body>

<header class="letterhead">
  <div class="letterhead-inner">
    <div>
      <div class="crest-title">GGITS Assistant</div>
      <div class="crest-sub">Academics, fees &amp; scholarships — answered from the official handbook</div>
    </div>
    <div class="programme-chip" id="programme-badge" style="display:none;"></div>
  </div>
</header>

<main>
  <!-- Programme selector -->
  <section id="selector">
    <h2>Which programme are you in?</h2>
    <p class="hint">Answers are personalized to your programme wherever the rules differ.</p>
    <div class="chip-grid" id="chip-grid"></div>
  </section>

  <!-- Chat -->
  <section id="chat-screen">
    <div id="messages"></div>
    <div id="input-bar">
      <input id="msg-input" type="text" placeholder="Ask about attendance, exams, fees, scholarships…" autocomplete="off" />
      <button id="send-btn">Send</button>
    </div>
  </section>
</main>

<script>
  // Point this at wherever your FastAPI server is running.
  const API_BASE = "http://localhost:8000";

  const PROGRAMMES = [
    { code: "1", name: "B.Tech" },
    { code: "2", name: "M.Tech" },
    { code: "3", name: "B.Com (H)" },
    { code: "4", name: "BBA" },
    { code: "5", name: "MBA" },
    { code: "6", name: "MCA" },
    { code: "7", name: "BCA" },
  ];

  const CATEGORY_LABEL = {
    academic: "Academic",
    fee: "Fee & scholarships",
    general: "General",
  };

  let sessionId = null;      // kept in memory only, for this page session
  let selectedProgramme = null;

  const chipGrid = document.getElementById("chip-grid");
  const selector = document.getElementById("selector");
  const chatScreen = document.getElementById("chat-screen");
  const messagesEl = document.getElementById("messages");
  const input = document.getElementById("msg-input");
  const sendBtn = document.getElementById("send-btn");
  const programmeBadge = document.getElementById("programme-badge");

  PROGRAMMES.forEach(p => {
    const btn = document.createElement("button");
    btn.className = "prog-chip";
    btn.innerHTML = `<span class="code">Option ${p.code}</span>${p.name}`;
    btn.onclick = () => startChat(p.name);
    chipGrid.appendChild(btn);
  });

  function startChat(programmeName){
    selectedProgramme = programmeName;
    programmeBadge.textContent = programmeName + " student";
    programmeBadge.style.display = "inline-block";
    selector.style.display = "none";
    chatScreen.classList.add("active");

    addAiMessage(
      `Hi! You're set as a ${programmeName} student. Ask me anything about attendance, exams, fees, or scholarships.`,
      "general"
    );
    input.focus();
  }

  function addRow(role, text, category){
    const row = document.createElement("div");
    row.className = `row ${role}`;

    if(role === "ai"){
      const wrap = document.createElement("div");
      wrap.className = "bubble-wrap";

      if(category && CATEGORY_LABEL[category]){
        const tag = document.createElement("div");
        tag.className = `tag ${category}`;
        tag.textContent = CATEGORY_LABEL[category];
        wrap.appendChild(tag);
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      wrap.appendChild(bubble);
      row.appendChild(wrap);
    } else {
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      row.appendChild(bubble);
    }

    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return row;
  }

  function addAiMessage(text, category){
    addRow("ai", text, category);
  }

  function showTyping(){
    const row = document.createElement("div");
    row.className = "row ai typing";
    row.id = "typing-row";
    row.innerHTML = `<div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
    messagesEl.appendChild(row);
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function hideTyping(){
    const row = document.getElementById("typing-row");
    if(row) row.remove();
  }

  async function sendMessage(){
    const text = input.value.trim();
    if(!text) return;

    addRow("human", text);
    input.value = "";
    sendBtn.disabled = true;
    showTyping();

    try{
      const res = await fetch(`${API_BASE}/api/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          message: text,
          programme: selectedProgramme,
          session_id: sessionId,
        }),
      });

      if(!res.ok){
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Request failed (${res.status})`);
      }

      const data = await res.json();
      sessionId = data.session_id;
      hideTyping();
      addAiMessage(data.reply, data.category);
    } catch(e){
      hideTyping();
      const note = document.createElement("div");
      note.className = "error-note";
      note.textContent = `Couldn't reach the assistant: ${e.message}`;
      messagesEl.appendChild(note);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  input.addEventListener("keydown", (e) => {
    if(e.key === "Enter") sendMessage();
  });
</script>

</body>
</html>
